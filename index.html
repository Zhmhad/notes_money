<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keuangan Mahasiswa</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211c;--mu:#6b7770;--bd:#e1e7e3;--pri:#0f8a5f;--in:#0f8a5f;--out:#d14343;--warn:#c98a0a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1b2420;--tx:#e8efeb;--mu:#8fa098;--bd:#2a3730;--pri:#2fbf8a;--in:#2fbf8a;--out:#ef6b6b;--warn:#e0a830}}
:root[data-theme="dark"]{--bg:#111815;--card:#1b2420;--tx:#e8efeb;--mu:#8fa098;--bd:#2a3730;--pri:#2fbf8a;--in:#2fbf8a;--out:#ef6b6b;--warn:#e0a830}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0}.sub{color:var(--mu);font-size:.85rem}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:800px){.grid{grid-template-columns:360px 1fr}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat small{color:var(--mu);font-size:.72rem}.stat b{display:block;font-size:1rem;word-break:break-word}
.saldo b{color:var(--pri)}.in b{color:var(--in)}.out b{color:var(--out)}
label{font-size:.8rem;color:var(--mu);display:block;margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);cursor:pointer}
.seg button.on.in{background:var(--in);color:#fff;border-color:var(--in)}
.seg button.on.out{background:var(--out);color:#fff;border-color:var(--out)}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:.85rem}
.btn.ghost{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:500}
h2{font-size:1rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:20px;background:var(--bg);overflow:hidden}
.chip button{border:0;background:none;cursor:pointer;padding:7px 10px;font-size:.85rem}
.chip .x{padding:7px 9px 7px 0;color:var(--mu)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}.chip.on .x{color:#fff}
.addcat{display:flex;gap:6px;margin-top:8px}.addcat input{padding:8px 10px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.88rem;color:var(--tx)}.chk input{width:auto}
.item{display:grid;grid-template-columns:1fr 110px 32px;gap:6px;margin-bottom:6px}
.item input{padding:8px 10px}.item button{border:0;background:none;color:var(--mu);cursor:pointer}
.tot{display:flex;justify-content:space-between;margin-top:6px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .m{flex:1;min-width:0}.row .m div{font-size:.92rem}.row .m small{color:var(--mu);display:block}
.amt{font-weight:600;white-space:nowrap}.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.del{border:0;background:none;color:var(--mu);cursor:pointer;font-size:1.1rem;padding:4px 8px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--out)}
.cat{display:flex;justify-content:space-between;font-size:.85rem}
.bud i{background:var(--pri)}.bud.w i{background:var(--warn)}.bud.d i{background:var(--out)}
.empty{color:var(--mu);text-align:center;padding:20px 0;font-size:.9rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tools input{width:auto}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:420px;width:100%;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:.9rem;display:flex;gap:10px;align-items:flex-start;animation:in .25s ease}
.toast.warn{border-left-color:var(--warn)}.toast.err{border-left-color:var(--out)}
.toast span{flex:1}.toast button{border:0;background:none;color:var(--mu);cursor:pointer;font-size:1rem}
@keyframes in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
.theme{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="toasts"></div>
<div class="wrap">
<header>
  <div><h1>💰 Catatan Keuangan</h1><div class="sub">Pantau uang saku bulananmu</div></div>
  <button class="theme" id="theme" title="Ganti tema">🌓</button>
</header>

<div class="stats">
  <div class="stat saldo"><small>Saldo (semua waktu)</small><b id="sSaldo">Rp0</b></div>
  <div class="stat in"><small>Pemasukan bulan ini</small><b id="sIn">Rp0</b></div>
  <div class="stat out"><small>Pengeluaran bulan ini</small><b id="sOut">Rp0</b></div>
</div>

<div class="grid">
  <div>
    <div class="card">
      <h2>Tambah Catatan</h2>
      <div class="seg">
        <button type="button" class="out on" data-t="out">Pengeluaran</button>
        <button type="button" class="in" data-t="in">Pemasukan</button>
      </div>

      <label>Kategori (ketuk untuk memilih)</label>
      <div class="chips" id="chips"></div>
      <div class="addcat">
        <input id="newCat" type="text" placeholder="Kategori baru, mis. Transport" maxlength="30">
        <button class="btn sm ghost" id="addCat" type="button">Tambah</button>
      </div>

      <label class="chk" id="itemsChkWrap"><input type="checkbox" id="itemsChk"> Catat per item (daftar belanja)</label>

      <div id="amtBox">
        <label for="amt">Jumlah (Rp)</label>
        <input id="amt" type="text" inputmode="numeric" placeholder="contoh: 50.000" autocomplete="off">
      </div>

      <div id="itemsBox" hidden>
        <label>Daftar item</label>
        <div id="itemRows"></div>
        <button class="btn sm ghost" id="addItem" type="button">+ Tambah item</button>
        <div class="tot"><span>Total</span><span id="itemsTotal">Rp0</span></div>
      </div>

      <label for="note">Catatan (opsional)</label>
      <input id="note" type="text" placeholder="contoh: belanja minggu ke-2" maxlength="60">
      <label for="date">Tanggal</label>
      <input id="date" type="date">
      <button class="btn" id="add" type="button">Simpan</button>
    </div>

    <div class="card" style="margin-top:12px">
      <h2>Batas Pengeluaran Bulanan</h2>
      <input id="budget" type="text" inputmode="numeric" placeholder="contoh: 1.500.000" autocomplete="off">
      <button class="btn sm" id="saveBud" type="button" style="margin-top:10px">Atur Batas</button>
      <div id="budBox" style="margin-top:12px"></div>
    </div>
  </div>

  <div>
    <div class="card" style="margin-bottom:12px">
      <div class="tools">
        <h2 style="margin:0;flex:1">Ringkasan</h2>
        <input id="month" type="month">
      </div>
      <div id="sum" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2>Riwayat</h2>
      <div id="list"></div>
    </div>
  </div>
</div>
</div>

<script>
var DEF={out:["Belanja mingguan di pasar","Jajan di kampus","Beli tambahan di Indomaret"],in:["TF orang tua"]};
var KEY="keuangan-mhs-v1";
var S={tx:[],budget:0,warned:{},cats:null},type="out",curCat={out:null,in:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.tx))S=Object.assign(S,p)}}catch(e){}
if(!S.cats||!S.cats.out||!S.cats.in)S.cats={out:DEF.out.slice(),in:DEF.in.slice()};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var rp=function(n){return "Rp"+Math.round(n).toLocaleString("id-ID")};
var num=function(s){return parseInt(String(s).replace(/\D/g,""),10)||0};
function fmtInput(el){var n=num(el.value);el.value=n?n.toLocaleString("id-ID"):""}
["amt","budget"].forEach(function(i){$(i).addEventListener("input",function(){fmtInput(this)})});

function toast(msg,kind){
  var d=document.createElement("div");d.className="toast "+(kind||"");
  var s=document.createElement("span");s.textContent=msg;
  var b=document.createElement("button");b.textContent="✕";b.setAttribute("aria-label","Tutup");
  d.appendChild(s);d.appendChild(b);$("toasts").appendChild(d);
  var rm=function(){if(d.parentNode)d.parentNode.removeChild(d)};
  b.onclick=rm;setTimeout(rm,5000);
}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
$("date").value=today();$("month").value=today().slice(0,7);

/* ---------- Kategori ---------- */
function selCat(){var l=S.cats[type];if(!curCat[type]||l.indexOf(curCat[type])<0)curCat[type]=l[0]||null;return curCat[type]}
function autoItems(){$("itemsChk").checked=type==="out"&&/pasar/i.test(selCat()||"");toggleItems()}
function renderChips(){
  var box=$("chips");box.innerHTML="";var cur=selCat();
  S.cats[type].forEach(function(c){
    var w=document.createElement("span");w.className="chip"+(c===cur?" on":"");
    var b=document.createElement("button");b.type="button";b.textContent=c;
    b.onclick=function(){curCat[type]=c;renderChips();autoItems()};
    var x=document.createElement("button");x.type="button";x.className="x";x.textContent="✕";x.setAttribute("aria-label","Hapus kategori "+c);
    x.onclick=function(){
      if(S.cats[type].length<=1){toast("Sisakan minimal satu kategori.","warn");return}
      S.cats[type]=S.cats[type].filter(function(k){return k!==c});save();renderChips();autoItems();
      toast("Kategori \""+c+"\" dihapus. Catatan lama tetap aman.");
    };
    w.appendChild(b);w.appendChild(x);box.appendChild(w);
  });
}
$("addCat").onclick=function(){
  var v=$("newCat").value.trim();
  if(!v){toast("Tulis nama kategori dulu.","warn");return}
  var ex=S.cats[type].some(function(k){return k.toLowerCase()===v.toLowerCase()});
  if(ex){toast("Kategori itu sudah ada.","warn");return}
  S.cats[type].push(v);curCat[type]=v;$("newCat").value="";save();renderChips();autoItems();
  toast("Kategori \""+v+"\" ditambahkan ✅");
};
$("newCat").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("addCat").click()}});
document.querySelectorAll(".seg button").forEach(function(b){b.onclick=function(){
  type=b.dataset.t;document.querySelectorAll(".seg button").forEach(function(x){x.classList.toggle("on",x===b)});
  $("itemsChkWrap").style.display=type==="out"?"flex":"none";renderChips();autoItems()}});

/* ---------- Daftar item ---------- */
function toggleItems(){
  var on=$("itemsChk").checked&&type==="out";
  $("itemsBox").hidden=!on;$("amtBox").hidden=on;
  if(on&&!$("itemRows").children.length)addRow();
}
$("itemsChk").onchange=toggleItems;
function itemsTotal(){var t=0;document.querySelectorAll("#itemRows .item").forEach(function(r){t+=num(r.children[1].value)});$("itemsTotal").textContent=rp(t);return t}
function addRow(focus){
  var r=document.createElement("div");r.className="item";
  var n=document.createElement("input");n.type="text";n.placeholder="Nama item";n.maxLength=40;
  var p=document.createElement("input");p.type="text";p.inputMode="numeric";p.placeholder="Harga";
  var x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Hapus item");
  p.addEventListener("input",function(){fmtInput(p);itemsTotal()});
  p.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addRow(true)}});
  n.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();p.focus()}});
  x.onclick=function(){
    if($("itemRows").children.length>1){r.remove();itemsTotal()}else{n.value="";p.value="";itemsTotal()}
  };
  r.appendChild(n);r.appendChild(p);r.appendChild(x);$("itemRows").appendChild(r);
  if(focus)n.focus();
}
$("addItem").onclick=function(){addRow(true)};
function resetItems(){$("itemRows").innerHTML="";if(!$("itemsBox").hidden)addRow();itemsTotal()}

/* ---------- Hitung & peringatan ---------- */
function monthSpent(m){return S.tx.filter(function(t){return t.type==="out"&&t.date.slice(0,7)===m}).reduce(function(a,t){return a+t.amt},0)}
function balance(){return S.tx.reduce(function(a,t){return a+(t.type==="in"?t.amt:-t.amt)},0)}
function checkAlerts(m){
  var before=S.warned[m]||0;
  if(S.budget>0){
    var r=monthSpent(m)/S.budget;
    if(r>=1&&before<2){toast("🚨 Pengeluaran bulan ini sudah melewati batas "+rp(S.budget)+"!","err");S.warned[m]=2}
    else if(r>=.8&&r<1&&before<1){toast("⚠️ Pengeluaran sudah "+Math.round(r*100)+"% dari batas bulanan. Hati-hati ya!","warn");S.warned[m]=1}
    else if(r<.8){S.warned[m]=0}
  }
  if(balance()<0)toast("Saldo kamu minus. Cek lagi catatanmu.","err");
}

/* ---------- Simpan catatan ---------- */
$("add").onclick=function(){
  var cat=selCat(),a=0,items=null;
  if(!cat){toast("Tambah kategori dulu ya.","warn");return}
  if($("itemsChk").checked&&type==="out"){
    items=[];
    document.querySelectorAll("#itemRows .item").forEach(function(r){
      var n=r.children[0].value.trim(),p=num(r.children[1].value);
      if(p>0)items.push({n:n||"Item",p:p});
    });
    a=items.reduce(function(s,i){return s+i.p},0);
    if(!items.length){toast("Isi minimal satu item beserta harganya.","warn");return}
  }else{a=num($("amt").value)}
  if(!a){toast("Isi jumlah dulu ya.","warn");return}
  if(!$("date").value){toast("Pilih tanggal dulu.","warn");return}
  var t={id:Date.now(),type:type,cat:cat,amt:a,note:$("note").value.trim(),date:$("date").value};
  if(items)t.items=items;
  S.tx.push(t);
  $("amt").value="";$("note").value="";resetItems();
  toast((type==="in"?"Pemasukan ":"Pengeluaran ")+rp(a)+(items?" ("+items.length+" item)":"")+" tersimpan ✅");
  var m=t.date.slice(0,7);if(m!==$("month").value)$("month").value=m;
  checkAlerts(m);save();render();
};
$("saveBud").onclick=function(){
  S.budget=num($("budget").value);S.warned={};save();
  toast(S.budget?"Batas bulanan diatur: "+rp(S.budget):"Batas bulanan dimatikan");
  render();
};
$("month").onchange=render;
$("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
function del(id){
  var t=S.tx.filter(function(x){return x.id===id})[0];if(!t)return;
  S.tx=S.tx.filter(function(x){return x.id!==id});save();render();
  toast("Catatan dihapus: "+t.cat+" "+rp(t.amt));
}

/* ---------- Tampilan ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var m=$("month").value||today().slice(0,7);
  var mt=S.tx.filter(function(t){return t.date.slice(0,7)===m}).sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id});
  var inn=0,out=0,per={};
  mt.forEach(function(t){if(t.type==="in")inn+=t.amt;else{out+=t.amt;per[t.cat]=(per[t.cat]||0)+t.amt}});
  $("sSaldo").textContent=rp(balance());$("sIn").textContent=rp(inn);$("sOut").textContent=rp(out);

  var h="",keys=Object.keys(per).sort(function(a,b){return per[b]-per[a]});
  if(!keys.length)h+='<div class="empty" style="padding:6px 0">Belum ada pengeluaran bulan ini.</div>';
  keys.forEach(function(c){var v=per[c],pc=out?v/out*100:0;
    h+='<div class="cat"><span>'+esc(c)+'</span><b>'+rp(v)+'</b></div><div class="bar"><i style="width:'+pc+'%"></i></div>'});
  h+='<div class="sub">Selisih bulan ini: <b style="color:var(--'+(inn-out>=0?"in":"out")+')">'+rp(inn-out)+'</b></div>';
  $("sum").innerHTML=h;

  var bb="";
  if(S.budget>0){
    var r=out/S.budget,cls=r>=1?"d":r>=.8?"w":"";
    bb='<div class="cat"><span>Terpakai '+Math.round(r*100)+'%</span><b>'+rp(out)+' / '+rp(S.budget)+'</b></div><div class="bar bud '+cls+'"><i style="width:'+Math.min(100,r*100)+'%"></i></div>'+
       '<div class="sub">'+(S.budget-out>=0?"Sisa "+rp(S.budget-out):"Lebih "+rp(out-S.budget))+'</div>';
    if(!$("budget").value)$("budget").value=S.budget.toLocaleString("id-ID");
  }
  $("budBox").innerHTML=bb;

  var L=$("list");L.innerHTML="";
  if(!mt.length){L.innerHTML='<div class="empty">Belum ada catatan di bulan ini.</div>';return}
  mt.forEach(function(t){
    var r=document.createElement("div");r.className="row";
    var d=new Date(t.date+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"});
    var mm=document.createElement("div");mm.className="m";
    var a=document.createElement("div");a.textContent=t.cat;
    var s=document.createElement("small");s.textContent=d+(t.note?" · "+t.note:"");
    mm.appendChild(a);mm.appendChild(s);
    if(t.items&&t.items.length){
      var it=document.createElement("small");
      it.textContent=t.items.map(function(i){return i.n+" "+rp(i.p)}).join(", ");
      mm.appendChild(it);
    }
    var am=document.createElement("div");am.className="amt "+t.type;am.textContent=(t.type==="in"?"+":"-")+rp(t.amt);
    var b=document.createElement("button");b.className="del";b.textContent="🗑";b.setAttribute("aria-label","Hapus");b.onclick=function(){del(t.id)};
    r.appendChild(mm);r.appendChild(am);r.appendChild(b);L.appendChild(r);
  });
}
renderChips();autoItems();render();
</script>
</body>
</html>
